name: Update stock ranking

on:
  schedule:
    # 日本時間(JST)平日 7:00 / 12:00 / 21:00 に実行
    # cronはUTC基準のため9時間ずらしている
    - cron: "0 22 * * 0-4"  # JST 平日 07:00
    - cron: "0 3 * * 1-5"   # JST 平日 12:00
    - cron: "0 12 * * 1-5"  # JST 平日 21:00
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - run: python collector.py

      - name: Commit and push updated ranking data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --cached --quiet && echo "No changes to commit" || git commit -m "Update ranking data"
          git push
