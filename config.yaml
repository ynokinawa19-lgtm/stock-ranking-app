# ランキングスコアの重み(合計が1.0になるように)
weights:
  price_change: 0.40    # 値上がり率
  volume_surge: 0.30    # 出来高急増率
  news_surge: 0.15      # ニュース件数急増
  rsi: 0.15             # RSI(過熱感)

# RSIの過熱判定しきい値
rsi_overheat_threshold: 80
